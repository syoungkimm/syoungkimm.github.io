<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공조사 필기 암기노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 탭(암기노트·기출 대조) → 고정 필터 바 → 과목별 섹션, 행마다 주제 | 핵심(표·보완 포함) | 주의 3칸 */
:root{
  --bg:#f6f7f5; --surface:#ffffff; --fg:#1b1f1d; --muted:#5f6a66; --line:#dde3e0; --line2:#eef1ef;
  --accent:#0f5c4d; --accent-soft:#e3efeb;
  --add:#0a5fb4; --add-bg:#eaf3fd; --add-line:#b9d6f5;
  --warn:#8a5a00; --warn-bg:#fff4d6; --th:#e8eef6;
  --f-display:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-body:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111514; --surface:#181e1c; --fg:#e3eae7; --muted:#9aa8a3; --line:#2b3532; --line2:#222a28;
  --accent:#6cc3ad; --accent-soft:#1d3530; --add:#8cc4ff; --add-bg:#16263a; --add-line:#2c4a6e;
  --warn:#e6b85c; --warn-bg:#33290f; --th:#1f2a36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514; --surface:#181e1c; --fg:#e3eae7; --muted:#9aa8a3; --line:#2b3532; --line2:#222a28;
  --accent:#6cc3ad; --accent-soft:#1d3530; --add:#8cc4ff; --add-bg:#16263a; --add-line:#2c4a6e;
  --warn:#e6b85c; --warn-bg:#33290f; --th:#1f2a36; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--fg);padding-bottom:14px}
h1{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;font-size:clamp(22px,3.6vw,30px);margin:0}
.lede{margin:0;color:var(--muted);max-width:75ch}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend b.lg-add{color:var(--add)} .legend span.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;background:var(--line2);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.bar input,.bar select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.bar input[type=search]{flex:1 1 220px;min-width:0}
.bar label{font-size:13px;display:flex;gap:6px;align-items:center;color:var(--muted)}
.count{font-size:13px;color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec{margin-top:10px}
.sec h2{font-size:15px;margin:0 0 6px;padding:6px 10px;background:var(--accent-soft);color:var(--accent);border-radius:6px}
.grid{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,3.2fr) minmax(0,2fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.grid>.hd{font-size:12px;letter-spacing:.04em;color:var(--muted);background:var(--line2);padding:6px 10px;border-bottom:1px solid var(--line)}
.row{display:contents}
.row>div{padding:10px;border-bottom:1px solid var(--line2);min-width:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.row .topic{font-weight:700}
.newtag{display:inline-block;font-size:11px;font-weight:700;color:var(--add);border:1px solid var(--add-line);border-radius:4px;padding:0 5px;margin-bottom:4px;white-space:nowrap}
.add{margin-top:8px;padding:8px 10px;background:var(--add-bg);border-left:3px solid var(--add);color:var(--add);font-size:13.5px;border-radius:0 6px 6px 0}
.add .lbl{font-weight:700;font-size:12px;display:block;margin-bottom:2px}
.add .warn{color:var(--warn);font-weight:700}
.tblbox{margin-top:8px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tblbox .cap{font-size:12px;color:var(--muted);padding:4px 8px;background:var(--line2)}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left;white-space:pre-wrap;word-break:keep-all;min-width:90px}
th{background:var(--th);font-weight:700}
td:first-child{font-weight:600}
.memo{font-size:12px;color:var(--warn);padding:4px 8px;background:var(--warn-bg)}
.no{display:inline-block;min-width:26px;margin-right:6px;padding:0 5px;border-radius:4px;background:var(--line2);color:var(--muted);font-size:12px;font-weight:700;text-align:center;vertical-align:1px}
.qlink{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.dref{margin-top:6px;font-size:12.5px;color:var(--add)}
.ids{font-size:12px;color:var(--add);margin-top:6px}
.plain{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.plain .tscroll table td:first-child{white-space:nowrap}
.k-A{color:var(--accent)} .k-B,.k-C{color:var(--add)} .k-D{color:var(--warn);font-weight:700}
.hit-d td{background:var(--warn-bg)}
.empty{color:var(--muted);padding:20px 0}
@media (max-width:760px){
  .grid{grid-template-columns:1fr}
  .grid>.hd{display:none}
  .row>div{border-bottom:none;padding:6px 12px}
  .row>.topic{padding-top:12px;border-top:1px solid var(--line)}
  .row>.note:not(:empty)::before{content:"주의·구분";display:block;font-size:11px;color:var(--muted)}
  .row>.note{padding-bottom:12px}
}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>공조사 필기 암기노트</h1>
  <p class="lede">내 암기노트(공조사 정리)를 그대로 옮기고, 1회 필기 복원 155문항과 대조해 부족한 부분만 덧붙였습니다. 캡처 이미지였던 표 13개는 해당 행의 ‘시험용 핵심’ 칸 안에 넣었고, 기출로 새로 추가한 항목은 과목별 자리에 끼워 넣었습니다.</p>
  <div class="legend"><span>검정 글씨 = 원래 노트</span><span><b class="lg-add">파란 글씨·파란 상자</b> = 기출 반영 추가 (<span class="newtag">신규</span> 표시 행 = 새 항목)</span><span><span class="sw" style="background:var(--warn-bg);border:1px solid var(--warn)"></span>노란 = 확인 필요</span></div>
</header>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="bar" id="bar">
  <input id="q" type="search" placeholder="검색 (예: 지체상금, 선금, 이의신청)" aria-label="검색">
  <select id="sec" aria-label="과목"><option value="">전체</option></select>
  <label><input type="checkbox" id="onlyAdd"> 보완·신규만</label>
  <span class="count" id="count"></span>
</div>
<main id="view"></main>
<footer>근거: 공공조달역량개발원 공공조달관리사 표준교재 1~4권, 국가계약법령·계약예규. 법령 수치는 시험 전 국가법령정보센터에서 현행 여부를 확인하세요.</footer>
</div>

  $('#count').textContent=`${list.length}개 항목`;

  return groups.map(g=>`<section class="sec"><h2>${esc(g.k)}</h2><div class="grid"><div class="hd">주제</div><div class="hd">시험용 핵심</div><div class="hd">주의·구분</div>${g.rows.map(r=>`<div class="row${r.new?' new':''}" id="${r.r?'r'+r.r:''}"><div class="topic"><span class="no">${r.no}</span>${r.new?'<span class="newtag">신규</span>\n':''}${rich(r.b)}</div><div class="core">${rich(r.c)}${r.tbl?tableHTML(r.tbl.rows,'표 '+r.tbl.id+' · 원래 캡처 이미지를 표로 변환',r.tbl.memo):''}${r.add?addHTML(r.add):''}${r.ids?`<div class="ids">관련 기출: ${esc(r.ids)}</div>`:''}</div><div class="note">${rich(r.d)}${r.dadd?`<div class="dref">근거: ${esc(r.dadd)}</div>`:''}</div></div>`).join('')}</div></section>`).join('');
}
function plainTable(rows,opt={}){
  const q=$('#q').value.trim().toLowerCase();
  const body=rows.slice(1).filter(r=>!q||r.join(' ').toLowerCase().includes(q));
  $('#count').textContent=`${body.length}개 행`;
  return `<div class="plain"><div class="tscroll"><table><thead><tr>${rows[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr class="${opt.cls?opt.cls(r):''}">${r.map((c,i)=>`<td${opt.td?opt.td(i,c):''}>${opt.fmt?opt.fmt(i,c):esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}
const runRows=rows=>rows.map(r=>r.map(c=>txt(c)));
function render(){
  let h='';
  if(tab==='note')h=renderNote();
  else if(tab==='s1'){
    const r=runRows(D.s1); const t1=r.slice(0,19).map(x=>x.slice(0,4)); const t2=r.slice(19).map(x=>x.slice(0,5));
    t1.forEach((x,i)=>{if(i===0)x.push('기출 보완');else x.push(i===11?(D.s1add['12']||'').replace(/^\[기출 보완\]\s*/,''):'')});
    h=`<h2 style="font-size:15px">주요 낙찰자 결정제도 (누구를 뽑나)</h2>`+plainTable(t1,{fmt:(i,c)=>i===4&&c?`<span style="color:var(--add)">${esc(c)}</span>`:esc(c)})+`<h2 style="font-size:15px;margin-top:16px">계약 방법의 결정 (누가 참여하나)</h2>`+plainTable(t2);
    $('#count').textContent='';
  }
  else if(tab==='num')h=plainTable(runRows(D.num));
  else if(tab==='an'){
    const rows=[['번호','과목','출제 주제','핵심 암기 포인트','기존 노트','분류','보완 내용','반영 위치']].concat(D.an.map(r=>r.slice(0,8)));
    h=`<p class="lede" style="margin-bottom:8px">A 충분 / B 보완 필요 / C 없음(신규 추가) / D 검토 필요. 노란 줄은 정답이나 근거를 아직 확정하지 못한 문항입니다. 번호를 누르면 출제근거표의 해당 문항으로 이동합니다.</p>`+plainTable(rows,{cls:r=>r[5]==='D'?'hit-d':'',fmt:(i,c)=>i===0?`<a class="qlink" href="sol261014.html#${encodeURIComponent(c)}">${esc(c)}</a>`:i===5?`<b class="k-${esc(c)}">${esc(c)}</b>`:esc(c)});
  }
  else if(tab==='err')h=plainTable(D.err,{cls:r=>/검토|표기/.test(r[2])?'hit-d':''});
  $('#view').innerHTML=h;
}
['#q','#sec','#onlyAdd'].forEach(s=>$(s).addEventListener('input',render));
tabs();render();
</script>
